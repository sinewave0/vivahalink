      <stop offset="0" stop-color="#3a0617"/>
      <stop offset="0.6" stop-color="#4a1942"/>
      <stop offset="1" stop-color="#5c1129"/>
    </linearGradient>
    <linearGradient id="silk1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a1636"/>
      <stop offset="1" stop-color="#cb2a5b" stop-opacity="0.4"/>
