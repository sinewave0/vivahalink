<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Photo placeholder — warm temple sunrise">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1636"/>
      <stop offset="0.55" stop-color="#a51d47"/>
      <stop offset="1" stop-color="#f5e68f"/>
    </linearGradient>
    <pattern id="kd" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#f5e68f" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <rect width="400" height="300" fill="url(#kd)"/>
  <circle cx="200" cy="172" r="46" fill="#f5e68f" opacity="0.95"/>
  <circle cx="200" cy="172" r="66" fill="#f5e68f" opacity="0.25"/>
  <!-- interlocked rings -->
  <g fill="none" stroke="#f5e68f" stroke-width="5">
    <circle cx="180" cy="252" r="17"/>
    <circle cx="216" cy="252" r="17" opacity="0.85"/>
  </g>
  <rect x="12" y="12" width="376" height="276" rx="14" fill="none" stroke="#f5e68f" stroke-width="1.5" opacity="0.4"/>
</svg>
