<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Photo placeholder — banana leaf feast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf5e8"/>
      <stop offset="1" stop-color="#dbf0dd"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#215d2b"/>
      <stop offset="1" stop-color="#5aad65"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <pattern id="kd" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="1.2" fill="#a5731a" opacity="0.35"/>
  </pattern>
  <rect width="400" height="300" fill="url(#kd)"/>
  <!-- open banana leaf -->
  <path d="M70 170 C 96 130 150 118 200 122 C 250 118 304 130 330 170 C 318 214 262 238 200 236 C 138 238 82 214 70 170 Z" fill="url(#leaf)"/>
  <path d="M84 170 C 150 150 250 150 316 170" fill="none" stroke="#f0f9f1" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <!-- feast items -->
  <g opacity="0.9">
    <circle cx="150" cy="196" r="12" fill="#e5c02a"/>
    <circle cx="200" cy="206" r="9" fill="#faf5e8"/>
    <circle cx="250" cy="196" r="12" fill="#df4a74"/>
  </g>
  <g stroke="#215d2b" stroke-width="4" opacity="0.5" stroke-linecap="round">
    <path d="M150 196 m-8 0 h16" stroke="#faf5e8"/>
  </g>
  <rect x="12" y="12" width="376" height="276" rx="14" fill="none" stroke="#215d2b" stroke-width="1.5" opacity="0.4"/>
</svg>
